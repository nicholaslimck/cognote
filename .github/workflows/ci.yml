name: CI

# Typecheck + unit tests on every push and PR. The unit suite is pure-logic
# (lib/**/*.test.ts) and runs in under a second — no database or browser
# needed, so this stays fast enough to never be worth skipping.
#
# A second job builds the Docker image when Docker-related paths change, so
# Dockerfile rot is caught without paying for a full image build on every PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Docker-relevant paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.example.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.ts'
              - 'proxy.ts'
              - 'app/**'
              - 'lib/**'
              - 'components/**'
              - 'public/**'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy
          cache-from: type=gha
          cache-to: type=gha,mode=max
